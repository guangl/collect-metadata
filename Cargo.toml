[package]
name = "collect-metadata"
version = "0.12.0"
license = "Apache-2.0"
edition = "2024"
default-run = "collect-metadata"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
web = ["dep:axum", "tokio/net", "tokio/rt-multi-thread"]

[[bin]]
name = "collect-metadata"
path = "src/bin/collect-metadata.rs"
required-features = ["desktop"]

[[bin]]
name = "collect-metadata-web"
path = "src/bin/collect-metadata-web.rs"
required-features = ["web"]

[dependencies]
axum = { version = "0.8", optional = true }
base64 = "0.22"
cap-std = "4"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "query", "rustls", "stream", "system-proxy"] }
regex = "1"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "json"] }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

unicode-normalization = "0.1"
whatlang = "0.18"
isolang = { version = "2.4", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
