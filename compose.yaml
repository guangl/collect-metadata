services:
  app:
    build: .
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      COLLECT_METADATA_AI_URL: "${COLLECT_METADATA_AI_URL:-}"
      COLLECT_METADATA_AI_MODEL: "${COLLECT_METADATA_AI_MODEL:-}"
      COLLECT_METADATA_AI_API_KEY: "${COLLECT_METADATA_AI_API_KEY:-}"
      EMBY_SYNC_TOKEN: "${EMBY_SYNC_TOKEN:-}"
      METADATA_TRANSLATION_URL: "${METADATA_TRANSLATION_URL:-}"
      METADATA_TRANSLATION_TOKEN: "${METADATA_TRANSLATION_TOKEN:-}"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: collect_metadata
      PGUSER: collect_metadata
      PGPASSWORD: "${POSTGRES_PASSWORD:?在 .env 中设置 POSTGRES_PASSWORD}"
      BANGUMI_ACCESS_TOKEN: "${BANGUMI_ACCESS_TOKEN:-}"
      TMDB_READ_ACCESS_TOKEN: "${TMDB_READ_ACCESS_TOKEN:-}"
      EMBY_URL: "${EMBY_URL:-}"
      EMBY_API_KEY: "${EMBY_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tmdb_config:/var/lib/collect-metadata
      - "${SCRAPE_OUTPUT_MOUNT:-scrape_output}:/output"
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: collect_metadata
      POSTGRES_USER: collect_metadata
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?在 .env 中设置 POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "collect_metadata", "-d", "collect_metadata"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  tmdb_config:
  scrape_output:
