name: Docker image

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths:
      - 'src/**'
      - 'ui/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.js'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'compose.ghcr.yaml'
      - 'LICENSE'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Collect Metadata
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: printf '%s\n' "$DIGEST" > "$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verify and publish multi-platform tags
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test the amd64 image with PostgreSQL
        shell: bash
        run: |
          amd64=$(<digests/amd64.txt)
          [[ "$amd64" =~ ^sha256:[[:xdigit:]]{64}$ ]]
          export COLLECT_METADATA_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@$amd64"
          export POSTGRES_PASSWORD=$(openssl rand -hex 18)
          compose=(docker compose -p collect-metadata-smoke -f compose.yaml -f compose.ghcr.yaml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 90
          if ! curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/healthz; then
            "${compose[@]}" logs --tail 100
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Collect Metadata'
      - name: Publish manifest
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:sha-${GITHUB_SHA:0:12}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(-t "$image:latest")
          else
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
            tags+=(-t "$image:${GITHUB_REF_NAME#v}")
          fi
          amd64=$(<digests/amd64.txt)
          arm64=$(<digests/arm64.txt)
          for digest in "$amd64" "$arm64"; do [[ "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; done
          docker buildx imagetools create "${tags[@]}" "$image@$amd64" "$image@$arm64"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA:0:12}"
