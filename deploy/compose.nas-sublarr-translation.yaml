services:
  sublarr:
    init: true
    mem_limit: 1280m
    memswap_limit: 1280m
    stop_grace_period: 40s
    command:
      - python3
      - -Bu
      - /bridge/sublarr_runtime.py
      - gunicorn
      - --bind
      - 0.0.0.0:5765
      - --worker-class
      - gthread
      - --workers
      - "1"
      - --threads
      - "100"
      - --timeout
      - "7200"
      - --graceful-timeout
      - "15"
      - --access-logfile
      - "-"
      - --access-logformat
      - '%(h)s %(t)s "%(m)s %(U)s" %(s)s %(b)s %(D)sus'
      - app:create_app()
    environment:
      PYTHONPATH: /app
      METADATA_TRANSLATION_COLLECT_ENV_FILE: /run/secrets/metadata-translation-collect.env
      METADATA_TRANSLATION_DOCKER_SUBNET: 172.29.0.0/16
      METADATA_TRANSLATION_USE_SUBLARR_DB: "1"
      METADATA_TRANSLATION_BUDGET_DB: /state/collect/budget.db
      METADATA_TRANSLATION_PRIVATE_TOKEN_FILE: /run/secrets/synopsis-token
      METADATA_TRANSLATION_PRIVATE_USAGE_DB: /state/private/translation.db
      METADATA_TRANSLATION_EPISODE_TOKEN_FILE: /run/secrets/episode-token
      METADATA_TRANSLATION_EPISODE_USAGE_DB: /state/episodes/translation.db
    volumes:
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/metadata-translation/sublarr-runtime
        target: /bridge
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/collect-metadata/translation/bridge.env
        target: /run/secrets/metadata-translation-collect.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/collect-metadata/translation/state
        target: /state/collect
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/emby/private-metadata/synopsis-translation/state
        target: /state/private
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/emby/private-metadata/synopsis-translation/token
        target: /run/secrets/synopsis-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/metadata-translation/episodes/state
        target: /state/episodes
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/metadata-translation/episodes/token
        target: /run/secrets/episode-token
        read_only: true
        bind:
          create_host_path: false
    networks:
      collect_metadata_translation:
        aliases: [metadata-translation-shared]
networks:
  collect_metadata_translation:
    name: collect-metadata_translation
    external: true
